[project]
name = "smart-restart"
version = "0.1.0a0"
description = "Rules-as-config restart decider for Python services. Don't restart your whole stack on every git push."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LBDog" }]
requires-python = ">=3.11"
keywords = [
    "deploy",
    "deployment",
    "restart",
    "systemd",
    "ci-cd",
    "ops",
    "monorepo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
smart-restart = "smart_restart.cli:main"

[project.urls]
Homepage = "https://github.com/zx22413/smart-restart"
Repository = "https://github.com/zx22413/smart-restart"
Documentation = "https://github.com/zx22413/smart-restart/blob/main/README.md"
Changelog = "https://github.com/zx22413/smart-restart/blob/main/CHANGELOG.md"
Issues = "https://github.com/zx22413/smart-restart/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_restart"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
